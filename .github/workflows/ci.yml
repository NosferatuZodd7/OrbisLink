name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Para pedir os trabalhos de Windows à mão quando fizerem falta e não
  # houver um pull request aberto.
  workflow_dispatch:

# Pushes seguidos no mesmo ramo cancelam a execução anterior, que já não
# interessa; em main e nos pull requests não se cancela nada.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'pull_request' }}

jobs:
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # O Remote Play vem do submódulo chiaki-ng.
          submodules: recursive
      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev \
            libopus-dev libjson-c-dev libminiupnpc-dev libevent-dev libssl-dev \
            libavcodec-dev libavutil-dev libavformat-dev protobuf-compiler python3-protobuf
      - name: Configurar
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DORBISLINK_WARNINGS_AS_ERRORS=ON -DORBISLINK_ENABLE_STREAM=ON
      - name: Compilar
        run: cmake --build build
      # Os erros de sintaxe nos blocos de PowerShell só aparecem cinco
      # minutos depois, num runner de Windows. Isto apanha-os aqui.
      - name: Verificar os workflows
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check-workflows.py
      # Um diálogo sem background sai branco, com o texto do tema invisível por
      # cima. Nenhum teste o apanha: o QML carrega e a janela abre na mesma.
      - name: Verificar que nenhuma janela sai branca
        run: python3 scripts/check-qml.py
      - name: Confirmar que o Remote Play foi mesmo compilado
        run: |
          # O ChiakiLib.cmake desliga-se sozinho se faltar alguma coisa; aqui
          # isso é um erro, senão os testes do stream desapareceriam em silêncio.
          test -f build/liborbislink_stream.a \
            || { echo "O Remote Play não foi compilado neste job." >&2; exit 1; }
      - name: Testar
        run: ctest --test-dir build --output-on-failure

  linux-gui:
    name: Linux — interface gráfica (Qt 6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev xvfb \
            libopus-dev libjson-c-dev libminiupnpc-dev libevent-dev libssl-dev \
            libavcodec-dev libavutil-dev libavformat-dev protobuf-compiler python3-protobuf \
            qt6-multimedia-dev qml6-module-qtmultimedia libsdl2-dev \
            qt6-base-dev qt6-declarative-dev qml6-module-qtquick \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-window qml6-module-qtquick-templates \
            qml6-module-qtqml-workerscript qml6-module-qtquick-dialogs \
            qml6-module-qtquick-shapes
      - name: Compilar
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build
      - name: Abrir a janela e capturar (smoke test contra a consola falsa)
        run: ./scripts/screenshots.sh "$PWD/capturas"
      - name: Auto-verificações da interface (arrastar e largar)
        run: ./scripts/gui-selftest.sh
      - uses: actions/upload-artifact@v4
        with:
          name: orbislink-capturas
          path: capturas/*.png

  windows-gui:
    name: Windows x64 — interface gráfica (Qt 6 + MSVC)
    runs-on: windows-latest
    # Os runners de Windows contam a dobrar nos minutos de Actions, e são
    # estes três trabalhos que consomem quase tudo. Num repositório
    # privado isso esgota a quota mensal em poucos dias de trabalho — e
    # quando esgota, para tudo, incluindo as verificações de Linux e a
    # publicação de versões.
    #
    # Em cada push correm só as verificações de Linux, que são as que
    # apanham erros: os 16 conjuntos de testes, as capturas, o selftest de
    # arrastar e os dois linters. Os de Windows correm nos pull requests e
    # à mão (Actions > CI > Run workflow), que é quando interessa mesmo ter
    # o .exe compilado.
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          # O Remote Play vem do submódulo chiaki-ng.
          submodules: recursive
      - name: Instalar o Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          arch: 'win64_msvc2022_64'
          # O vídeo do Remote Play usa o VideoOutput do QtMultimedia.
          modules: 'qtmultimedia'
          cache: true
      # Sem cache, compilar estes pacotes leva mais de dez minutos em cada
      # execução. A chave inclui a lista, para bastar mudá-la para a cache
      # ser refeita.
      # Restaurar e guardar em passos separados de propósito: o
      # actions/cache só guarda quando o job passa, e um job que falha
      # obrigaria a recompilar o OpenSSL e o SDL2 — vinte minutos — em cada
      # tentativa.
      - name: Restaurar a cache do vcpkg
        id: cache-vcpkg
        uses: actions/cache/restore@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-x64-windows-chiaki-deps-v2
      - name: Instalar dependências (vcpkg)
        run: |
          # O curl é do OrbisLink; o resto é o que o chiaki-lib precisa.
          # O FFmpeg não vem daqui: compilá-lo no vcpkg leva mais de vinte
          # minutos em cada execução.
          & "${env:VCPKG_INSTALLATION_ROOT}\vcpkg.exe" install `
            curl:x64-windows opus:x64-windows json-c:x64-windows `
            miniupnpc:x64-windows libevent:x64-windows openssl:x64-windows sdl2:x64-windows `
            protobuf:x64-windows pkgconf:x64-windows
      - name: Guardar a cache do vcpkg
        if: always() && steps.cache-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-x64-windows-chiaki-deps-v2
      - name: Instalar o FFmpeg (compilação LGPL já feita)
        run: |
          # LGPL e não GPL: é o que se pode distribuir com o resto sem
          # arrastar obrigações adicionais para quem usa o pacote.
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dist
          $raiz = (Get-ChildItem ffmpeg-dist -Directory | Select-Object -First 1).FullName
          "FFMPEG_ROOT=$raiz" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "FFmpeg em $raiz"
          Get-ChildItem "$raiz/bin" -Filter *.dll | Select-Object Name | Format-Table
      - name: Preparar o pkg-config para o chiaki-lib
        run: |
          # O chiaki-lib procura o json-c, o miniupnpc e o libevent por
          # pkg-config. Em Windows não há nenhum no sistema; o do vcpkg
          # chama-se pkgconf.exe, e é preciso dizer ao CMake onde está e
          # onde ficam os .pc que o vcpkg gerou.
          $pkgconf = Get-ChildItem "${env:VCPKG_INSTALLATION_ROOT}/installed/x64-windows" `
            -Recurse -Filter pkgconf.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $pkgconf) {
            throw "Não encontrei o pkgconf.exe no vcpkg. Sem ele o chiaki-lib não configura."
          }
          Write-Host "pkgconf em $($pkgconf.FullName)"
          "PKG_CONFIG_EXE=$($pkgconf.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $pc = "${env:VCPKG_INSTALLATION_ROOT}/installed/x64-windows/lib/pkgconfig"
          if (-not (Test-Path $pc)) { throw "Não encontrei os ficheiros .pc em $pc" }
          Get-ChildItem $pc -Filter *.pc | Select-Object Name | Format-Table
          "PKG_CONFIG_PATH=$pc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # O chiaki-lib é C e usa arrays de tamanho variável e
      # __attribute__((aligned)) — nenhum dos dois existe no compilador C da
      # Microsoft. O próprio chiaki-ng compila com clang-cl por esta razão.
      #
      # Não dá para passar só o C pelo clang-cl e deixar o C++ no MSVC: o
      # CMake recusa ("The current configuration mixes Clang and MSVC or some
      # other CL compatible compiler tool. This is not supported."). Portanto
      # vai tudo em clang-cl, que fala a mesma ABI que o MSVC — o Qt vem
      # compilado com MSVC e liga-se sem problema, e o job "Windows (MSVC,
      # compatibilidade)" continua a provar que o núcleo compila com o
      # compilador da Microsoft.
      - name: Preparar o ambiente do MSVC (para o gerador Ninja)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Localizar o clang-cl
        run: |
          $clang = Get-Command clang-cl.exe -ErrorAction SilentlyContinue
          if (-not $clang) {
            $candidato = "C:\Program Files\LLVM\bin\clang-cl.exe"
            if (Test-Path $candidato) { $clang = Get-Item $candidato }
          }
          if (-not $clang) {
            throw "Não encontrei o clang-cl. Sem ele o chiaki-lib não compila em Windows."
          }
          $caminho = if ($clang.Source) { $clang.Source } else { $clang.FullName }
          Write-Host "clang-cl em $caminho"
          & $caminho --version
          "CLANG_CL=$caminho" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Preparar o gerador de protocolo (protoc + nanopb)
        run: |
          # O chiaki gera o código do protocolo a partir de um .proto, com o
          # gerador do nanopb — um script de Python. Esse script procura, por
          # esta ordem: o módulo grpc_tools, e só depois um protoc no PATH.
          #
          # Dar o caminho do protoc ao CMake não basta, portanto: o script
          # não o vê. E o "protobuf" do pip traz uma versão muito à frente do
          # protoc do vcpkg, o que o próprio nanopb avisa que não pode ser
          # ("matches python-protobuf version").
          #
          # O grpcio-tools resolve os dois de uma vez: traz um protoc dentro
          # de si, já casado com a versão do protobuf que instala. O protoc
          # do vcpkg continua a ir para o PATH como segunda linha, para o
          # lado do CMake.
          python -m pip install --quiet grpcio-tools ninja
          python -c "import grpc_tools.protoc; print('grpc_tools ok')"
          python -c "import google.protobuf; print('protobuf', google.protobuf.__version__)"
          ninja --version
          $protoc = Get-ChildItem "${env:VCPKG_INSTALLATION_ROOT}/installed/x64-windows" `
            -Recurse -Filter protoc.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $protoc) {
            throw "Não encontrei o protoc.exe no vcpkg. Sem ele o Remote Play não compila."
          }
          Write-Host "protoc em $($protoc.FullName)"
          "PROTOC_EXE=$($protoc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # E no PATH, para quem o procura por nome em vez de perguntar ao CMake.
          $protoc.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Configurar
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_C_COMPILER="${env:CLANG_CL}" `
            -DCMAKE_CXX_COMPILER="${env:CLANG_CL}" `
            -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DORBISLINK_ENABLE_STREAM=ON `
            -DFFMPEG_ROOT="${env:FFMPEG_ROOT}" `
            -DPROTOC="${env:PROTOC_EXE}" `
            -DPKG_CONFIG_EXECUTABLE="${env:PKG_CONFIG_EXE}" `
            -DORBISLINK_BUILD_TESTS=OFF `
            -DORBISLINK_VERSION_NAME="0.0.0-ci-${env:GITHUB_SHA}"
      - name: Compilar
        run: cmake --build build
      - name: Juntar executáveis e DLLs
        run: |
          New-Item -ItemType Directory -Force -Path dist/gui | Out-Null
          # Tudo o que ficou ao lado do .exe: as DLLs do vcpkg (libcurl e
          # companhia) são copiadas para lá pelo próprio build.
          Copy-Item build/*.exe dist/gui/
          Copy-Item build/*.dll dist/gui/ -ErrorAction SilentlyContinue
          # As DLLs do FFmpeg não passam pelo TARGET_RUNTIME_DLLS do CMake
          # (o FindFFMPEG do chiaki cria alvos importados sem localização da
          # DLL), por isso vão daqui à mão.
          if ($env:FFMPEG_ROOT) {
            Copy-Item "$env:FFMPEG_ROOT/bin/*.dll" dist/gui/ -Force
          }
          # Qt (plugins, QML) e o runtime do MSVC (MSVCP140, VCRUNTIME140...).
          & "${env:QT_ROOT_DIR}\bin\windeployqt.exe" --qmldir qml/orbislink `
            --release --no-translations --compiler-runtime dist/gui/orbislink-gui.exe

          # O que o windeployqt deixou de facto, para nao se andar a
          # adivinhar quando faltar alguma coisa.
          Write-Host "--- pastas em dist/gui ---"
          Get-ChildItem dist/gui -Directory | Select-Object -ExpandProperty Name
          if (Test-Path dist/gui/plugins) {
            Write-Host "--- plugins ---"
            Get-ChildItem dist/gui/plugins -Directory | Select-Object -ExpandProperty Name
          }

          # O windeployqt varre os .qml a procura de imports, mas o
          # resultado nao e garantido: o QtMultimedia esta num ficheiro que
          # so e carregado por um Loader, e pode nao vir. Sem o modulo
          # QML o VideoOutput nao existe e o Remote Play fica sem imagem.
          #
          # Em vez de depender do qmlimportscanner, copia-se o que falta da
          # propria instalacao do Qt. O caminho onde o windeployqt os poe
          # muda entre versoes, por isso aceitam-se os dois.
          foreach ($modulo in @('QtMultimedia')) {
            $jaLa = (Test-Path "dist/gui/$modulo") -or (Test-Path "dist/gui/qml/$modulo")
            if ($jaLa) {
              Write-Host "Modulo QML ${modulo}: ja estava."
              continue
            }
            $origem = "${env:QT_ROOT_DIR}/qml/$modulo"
            if (-not (Test-Path $origem)) {
              throw "Nao encontrei o modulo QML ${modulo} em ${origem}. O Qt foi instalado sem o qtmultimedia?"
            }
            Copy-Item $origem dist/gui/ -Recurse -Force
            Write-Host "Modulo QML ${modulo}: copiado a mao de $origem"
          }

          # Os plugins do backend de multimedia vem pelo mesmo caminho. Sem
          # eles nao ha QAudioSink nenhum: a imagem continua a aparecer
          # (essa e empurrada a mao para um QVideoSink) e o jogo fica mudo,
          # sem erro nenhum. Por isso verifica-se que a pasta tem DLLs, e nao
          # so que existe: uma pasta vazia daria um instalador sem som.
          $destinoMultimedia = "dist/gui/multimedia"
          $jaTem = (Get-ChildItem $destinoMultimedia -Filter *.dll -Recurse -ErrorAction SilentlyContinue | Measure-Object).Count
          if ($jaTem -eq 0) {
            $pluginsMultimedia = "${env:QT_ROOT_DIR}/plugins/multimedia"
            if (-not (Test-Path $pluginsMultimedia)) {
              throw "Nao encontrei os plugins de multimedia em ${pluginsMultimedia}. O Qt foi instalado sem o qtmultimedia?"
            }
            if (Test-Path $destinoMultimedia) { Remove-Item $destinoMultimedia -Recurse -Force }
            Copy-Item $pluginsMultimedia dist/gui/ -Recurse -Force
            Write-Host "Plugins de multimedia: copiados a mao."
          }
          $dllsMultimedia = Get-ChildItem $destinoMultimedia -Filter *.dll -Recurse -ErrorAction SilentlyContinue
          if (-not $dllsMultimedia) {
            throw "A pasta ${destinoMultimedia} ficou sem plugins nenhuns. O Remote Play sairia sem som."
          }
          Write-Host "Plugins de multimedia:"
          $dllsMultimedia | Select-Object -ExpandProperty Name
      - name: Garantir o runtime do MSVC
        run: |
          # ATENÇÃO: nos runners há mais do que uma versão do redistribuível
          # instalada. Apanhar uma qualquer (Select-Object -First 1) pode trazer a
          # do Visual Studio 2019 (14.29) por cima da do 2022 que a aplicação
          # precisa, e isso dá uma violação de acesso dentro do MSVCP140.dll ainda
          # antes de a janela aparecer. Por isso escolhe-se sempre a mais recente,
          # e o conjunto todo vem da mesma pasta, para as três DLLs nunca serem de
          # versões diferentes.
          $candidatos = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio" `
            -Recurse -Filter "VCRUNTIME140.dll" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'x64\\Microsoft\.VC\d+\.CRT' }
          if (-not $candidatos) { throw "Não encontrei o redistribuível do MSVC no runner." }
          # O FileVersion de algumas destas DLLs traz texto a seguir aos
          # números ("14.29.30157.0 built by: cloudtest"), e isso rebenta a
          # conversão para [version]. Fica-se só com os números.
          function VersaoDoTexto([string]$bruto) {
            if ($bruto -match '^\s*(\d+(\.\d+){1,3})') { return [version]$Matches[1] }
            return [version]"0.0"
          }
          $maisRecente = $candidatos |
            Sort-Object { VersaoDoTexto $_.VersionInfo.FileVersion } -Descending |
            Select-Object -First 1
          Write-Host "Runtime escolhido: $($maisRecente.DirectoryName) ($($maisRecente.VersionInfo.FileVersion))"
          foreach ($dll in @('MSVCP140.dll','VCRUNTIME140.dll','VCRUNTIME140_1.dll')) {
            $origem = Join-Path $maisRecente.DirectoryName $dll
            if (Test-Path $origem) { Copy-Item $origem dist/gui/ -Force }
          }
      - name: Verificar que não falta nenhuma DLL
        run: |
          # Um pacote sem o runtime do MSVC ou sem o libcurl compila e empacota
          # sem erro, e só rebenta na máquina de quem o instala.
          $required = @('orbislink-gui.exe','Qt6Core.dll','Qt6Quick.dll','Qt6Qml.dll',
                        'libcurl.dll','MSVCP140.dll','VCRUNTIME140.dll','VCRUNTIME140_1.dll',
                        'Qt6Multimedia.dll')
          $missing = $required | Where-Object { -not (Test-Path "dist/gui/$_") }
          Get-ChildItem dist/gui | Select-Object Name, Length | Format-Table -AutoSize
          if ($missing) { throw "Faltam ficheiros no pacote: $($missing -join ', ')" }
          if (-not (Test-Path "dist/gui/platforms/qwindows.dll")) {
            throw "Falta o plugin de plataforma platforms/qwindows.dll"
          }
          # Sem o módulo QML do QtMultimedia o VideoOutput não existe e a
          # janela do Remote Play fica preta sem dizer porquê. O sítio onde
          # ele aterra muda entre versões do windeployqt, por isso valem os
          # dois — o que não vale é não estar em nenhum.
          if (-not ((Test-Path "dist/gui/QtMultimedia") -or (Test-Path "dist/gui/qml/QtMultimedia"))) {
            throw "Falta a pasta QML QtMultimedia (nem o windeployqt nem a cópia à mão a trouxeram)"
          }
          # O número de versão do FFmpeg muda a cada compilação, por isso
          # procura-se pelo padrão em vez de um nome fixo.
          foreach ($lib in @('avcodec','avutil','avformat')) {
            if (-not (Get-ChildItem dist/gui -Filter "$lib-*.dll")) {
              # As chaves não são decoração: um nome de variável seguido de
              # dois pontos é lido pelo PowerShell como um qualificador de
              # âmbito, e o script nem chega a correr.
              throw "Falta a DLL do ${lib}: o Remote Play não arrancaria."
            }
          }
          # As três DLLs do runtime têm de ser da mesma versão e não podem ser
          # mais antigas que o compilador que gerou o executável.
          function VersaoDoTexto([string]$bruto) {
            if ($bruto -match '^\s*(\d+(\.\d+){1,3})') { return [version]$Matches[1] }
            return [version]"0.0"
          }
          $versoes = @{}
          foreach ($dll in @('MSVCP140.dll','VCRUNTIME140.dll','VCRUNTIME140_1.dll')) {
            $versao = VersaoDoTexto (Get-Item "dist/gui/$dll").VersionInfo.FileVersion
            $versoes[$dll] = $versao.ToString()
            Write-Host "$dll -> $versao"
          }
          $distintas = @($versoes.Values | Select-Object -Unique)
          if ($distintas.Count -ne 1) {
            throw "Runtime do MSVC misturado: $($versoes | Out-String)"
          }
          $minima = [version]"14.30"
          $atual = [version]$distintas[0]
          if ($atual -lt $minima) {
            throw "Runtime do MSVC demasiado antigo ($atual). A aplicação é compilada com o Visual Studio 2022 e precisa de 14.30 ou superior."
          }
          Write-Host "Pacote completo (runtime $atual)."
      - uses: actions/upload-artifact@v4
        with:
          name: orbislink-gui-windows-x64
          path: dist/gui

  windows-mingw:
    name: Windows x64 — CLI e instalador (mingw-w64)
    runs-on: ubuntu-latest
    needs: [windows-gui]
    # Precisa da interface compilada pelo trabalho anterior, portanto
    # acompanha-o.
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Trazer a interface gráfica compilada no job anterior
        uses: actions/download-artifact@v4
        with:
          name: orbislink-gui-windows-x64
          path: gui-payload
      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 nsis cmake ninja-build zip
      - name: Cache do libcurl para mingw
        uses: actions/cache@v4
        with:
          path: build-windows/curl-install
          key: curl-mingw-8_11_1-${{ runner.os }}
      - name: Compilar o .exe, os testes e o instalador (com a interface)
        run: ORBISLINK_WINDOWS_TESTS=ON ORBISLINK_GUI_DIR="$PWD/gui-payload" ./scripts/build-windows.sh
      - name: Confirmar que o .exe só depende de DLLs do sistema
        run: |
          deps=$(x86_64-w64-mingw32-objdump -p dist/windows/orbislink-cli.exe \
            | grep "DLL Name" | awk '{print tolower($3)}' | sort -u)
          echo "$deps"
          for dll in $deps; do
            case "$dll" in
              kernel32.dll|msvcrt.dll|ws2_32.dll|advapi32.dll|crypt32.dll|bcrypt.dll|iphlpapi.dll|user32.dll|shell32.dll|ole32.dll|shlwapi.dll) ;;
              *) echo "DLL inesperada: $dll" >&2; exit 1 ;;
            esac
          done
      - name: Instalar o Wine
        run: sudo apt-get install -y wine64
      - name: Correr os testes do binário de Windows sob Wine
        run: ./scripts/test-windows-wine.sh
      - uses: actions/upload-artifact@v4
        with:
          name: orbislink-windows-x64-ci
          path: |
            dist/*.exe
            dist/*.zip

  windows-msvc:
    name: Windows (MSVC, compatibilidade)
    runs-on: windows-latest
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4
      # ${env:VAR}/... e não $env:VAR/... — no PowerShell a segunda forma
      # engole a barra no nome da variável e resulta em caminho vazio.
      - name: Instalar libcurl (vcpkg)
        run: |
          & "${env:VCPKG_INSTALLATION_ROOT}\vcpkg.exe" install curl:x64-windows
      - name: Configurar
        run: |
          cmake -S . -B build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows
      - name: Compilar
        run: cmake --build build --config RelWithDebInfo
      - name: Testar
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure
