name: Release

# Two ways to publish:
#
# * Stable version — a pushed v* tag, or "Run workflow" with the version
#   (e.g. v1.0.0). The tag is created at the end, on the commit that was built.
#
# * Testing build — every push to the beta branch. It comes out as prerelease
#   vX.Y.Z-dev.N (N is this run's number, always going up), and that is what
#   the app sees on the "Testing (branch builds)" channel: whoever is on that
#   channel gets every push without anyone publishing anything by hand. Per
#   semver, 1.0.1-dev.5 comes before 1.0.1, so whoever is on a dev gets the
#   stable when it comes out, and whoever is on the stable is never pushed
#   to a dev.
#   It can also be requested by hand: "Run workflow" with the version field empty.
#
# Only possible because the repository is public: unlimited Actions on the
# standard runners. On a private one, this would use up the quota in a day.
on:
  push:
    # Two branches: main is the official one (stables are published from it,
    # by hand); beta is where things are tried, and every push there becomes a
    # testing build. Pushes to main publish nothing by themselves.
    branches: ["beta"]
    tags: ["v*"]
    # Touching only the documentation does not change the program: not worth a version.
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão estável a publicar (ex.: v1.0.0). Vazio: compilação de testes do ramo escolhido."
        required: false
        default: ""

# Two consecutive pushes on the same branch: the first one's build no longer
# matters to anyone, and the second's includes it. Stables are never
# cancelled — each one is requested on purpose.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

# Publishing a Release is writing to the repository. Declared here, the
# workflow does not depend on the repository's default setting
# (Settings > Actions > Workflow permissions): with it on "read", the
# publish job would get a 403 "Resource not accessible by
# integration" after building everything.
permissions:
  contents: write

jobs:
  # Decides this build's number; every other job receives it
  # from here.
  #
  # Stable: the version lives in two places, the tag and CMake's project().
  # When they diverge, nobody notices — the installer comes out with the right
  # number because CI passes -DORBISLINK_VERSION_NAME, and whoever builds
  # from source gets the old number. So it is refused.
  #
  # Testing: the CMakeLists version with -dev.N. If that version has already
  # been published as stable, the dev would be "older" than it and nobody would
  # get it — so it moves to the next patch and warns.
  versao:
    name: Que versão é esta?
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.decidir.outputs.versao }}
      testes: ${{ steps.decidir.outputs.testes }}
    steps:
      - uses: actions/checkout@v4
      - name: Decidir
        id: decidir
        env:
          VERSAO_PEDIDA: ${{ inputs.version || github.ref_name }}
          VERSAO_INDICADA: ${{ inputs.version }}
        run: |
          cmake_versao=$(sed -n 's/^project(OrbisLink VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ -z "$cmake_versao" ]; then
            echo "::error::Não consegui ler a versão do CMakeLists.txt."
            exit 1
          fi
          testes_a_mao=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -z "$VERSAO_INDICADA" ]; then
            testes_a_mao=true
          fi
          if { [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "branch" ]; } \
            || [ "$testes_a_mao" = true ]; then
            base="$cmake_versao"
            if git ls-remote --exit-code --tags origin "refs/tags/v$base" >/dev/null; then
              IFS=. read -r maior menor patch <<< "$base"
              base="$maior.$menor.$((patch + 1))"
              echo "::warning::A v$cmake_versao já está publicada; esta compilação de testes sai como $base-dev.$GITHUB_RUN_NUMBER. Sobe o project() do CMakeLists.txt para a versão que vier a seguir."
            fi
            versao="v$base-dev.$GITHUB_RUN_NUMBER"
            testes=true
          else
            tag="${VERSAO_PEDIDA#v}"
            echo "tag=$tag  CMakeLists=$cmake_versao"
            if [ "$tag" != "$cmake_versao" ]; then
              echo "::error::A tag diz $tag e o CMakeLists.txt diz $cmake_versao. Corrige o project(OrbisLink VERSION ...) antes de publicar."
              exit 1
            fi
            versao="v$tag"
            testes=false
          fi
          echo "Versão: $versao (testes: $testes)"
          echo "versao=$versao" >> "$GITHUB_OUTPUT"
          echo "testes=$testes" >> "$GITHUB_OUTPUT"

  windows-gui:
    needs: versao
    name: Windows x64 — interface gráfica (Qt 6 + MSVC)
    runs-on: windows-latest
    env:
      ORBISLINK_RELEASE_VERSION: ${{ needs.versao.outputs.versao }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Remote Play comes from the chiaki-ng submodule.
          submodules: recursive
      - name: Instalar o Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          arch: 'win64_msvc2022_64'
          # The Remote Play video uses QtMultimedia's VideoOutput.
          modules: 'qtmultimedia'
          cache: true
      # Without a cache, building these packages takes over ten minutes on
      # every run. The key includes the vcpkg version of the runner image: if it
      # changes, what is in the cache is no longer valid and is rebuilt. Changing
      # the package list needs a new "-vN" at the end.
      # Restore and save in separate steps on purpose:
      # actions/cache only saves when the job passes, and a job failing
      # after the dependencies would force rebuilding OpenSSL and SDL2 —
      # twenty minutes — on every attempt. But it only saves after
      # vcpkg finishes successfully: a run cancelled midway would save an
      # incomplete folder, and a key already used is never written again.
      - name: Chave da cache do vcpkg
        id: chave-vcpkg
        run: |
          $versao = git -C "${env:VCPKG_INSTALLATION_ROOT}" rev-parse --short HEAD
          "chave=vcpkg-x64-windows-$versao-v3" >> $env:GITHUB_OUTPUT
      - name: Restaurar a cache do vcpkg
        id: cache-vcpkg
        uses: actions/cache/restore@v4
        with:
          path: C:\vcpkg\installed
          key: ${{ steps.chave-vcpkg.outputs.chave }}
      - name: Instalar dependências (vcpkg)
        run: |
          # curl is OrbisLink's; the rest is what chiaki-lib needs.
          # FFmpeg does not come from here: building it in vcpkg takes over twenty
          # minutes on every run.
          & "${env:VCPKG_INSTALLATION_ROOT}\vcpkg.exe" install `
            curl:x64-windows opus:x64-windows json-c:x64-windows `
            miniupnpc:x64-windows libevent:x64-windows openssl:x64-windows sdl2:x64-windows `
            protobuf:x64-windows pkgconf:x64-windows
      - name: Guardar a cache do vcpkg
        # No always(): only runs if vcpkg finished successfully and nothing was cancelled.
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg\installed
          key: ${{ steps.chave-vcpkg.outputs.chave }}
      - name: Instalar o FFmpeg (compilação LGPL já feita)
        run: |
          # LGPL and not GPL: that is what can be distributed with the rest
          # without dragging extra obligations onto whoever uses the package.
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dist
          $raiz = (Get-ChildItem ffmpeg-dist -Directory | Select-Object -First 1).FullName
          "FFMPEG_ROOT=$raiz" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "FFmpeg em $raiz"
          Get-ChildItem "$raiz/bin" -Filter *.dll | Select-Object Name | Format-Table
      - name: Preparar o pkg-config para o chiaki-lib
        run: |
          # chiaki-lib looks for json-c, miniupnpc and libevent through
          # pkg-config. On Windows there is none on the system; vcpkg's is
          # called pkgconf.exe, and CMake must be told where it is and
          # where the .pc files vcpkg generated are.
          $pkgconf = Get-ChildItem "${env:VCPKG_INSTALLATION_ROOT}/installed/x64-windows" `
            -Recurse -Filter pkgconf.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $pkgconf) {
            throw "Não encontrei o pkgconf.exe no vcpkg. Sem ele o chiaki-lib não configura."
          }
          Write-Host "pkgconf em $($pkgconf.FullName)"
          "PKG_CONFIG_EXE=$($pkgconf.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $pc = "${env:VCPKG_INSTALLATION_ROOT}/installed/x64-windows/lib/pkgconfig"
          if (-not (Test-Path $pc)) { throw "Não encontrei os ficheiros .pc em $pc" }
          Get-ChildItem $pc -Filter *.pc | Select-Object Name | Format-Table
          "PKG_CONFIG_PATH=$pc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # chiaki-lib is C and uses variable-length arrays and
      # __attribute__((aligned)) — neither exists in Microsoft's C
      # compiler. chiaki-ng itself builds with clang-cl for this reason.
      # Here only C goes through clang-cl; C++ (our code and Qt)
      # stays on MSVC, which is what already works and what is shipped. The
      # two produce compatible objects, so they link without trouble.
      - name: Preparar o ambiente do MSVC (para o gerador Ninja)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Localizar o clang-cl
        run: |
          $clang = Get-Command clang-cl.exe -ErrorAction SilentlyContinue
          if (-not $clang) {
            $candidato = "C:\Program Files\LLVM\bin\clang-cl.exe"
            if (Test-Path $candidato) { $clang = Get-Item $candidato }
          }
          if (-not $clang) {
            throw "Não encontrei o clang-cl. Sem ele o chiaki-lib não compila em Windows."
          }
          $caminho = if ($clang.Source) { $clang.Source } else { $clang.FullName }
          Write-Host "clang-cl em $caminho"
          & $caminho --version
          "CLANG_CL=$caminho" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Preparar o gerador de protocolo (protoc + nanopb)
        run: |
          # chiaki generates the protocol code from a .proto, with the
          # nanopb generator — a Python script that looks for the
          # grpc_tools module and only then a protoc on the PATH. grpcio-tools
          # carries a protoc inside, already matched to the protobuf version it
          # installs; giving CMake the path is not enough.
          # ninja comes this way because Visual Studio's is not on the PATH.
          python -m pip install --quiet grpcio-tools ninja
          python -c "import grpc_tools.protoc; print('grpc_tools ok')"
          python -c "import google.protobuf; print('protobuf', google.protobuf.__version__)"
          ninja --version
          $protoc = Get-ChildItem "${env:VCPKG_INSTALLATION_ROOT}/installed/x64-windows" `
            -Recurse -Filter protoc.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $protoc) {
            throw "Não encontrei o protoc.exe no vcpkg. Sem ele o Remote Play não compila."
          }
          Write-Host "protoc em $($protoc.FullName)"
          "PROTOC_EXE=$($protoc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $protoc.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Configurar
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_C_COMPILER="${env:CLANG_CL}" `
            -DCMAKE_CXX_COMPILER="${env:CLANG_CL}" `
            -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DORBISLINK_ENABLE_STREAM=ON `
            -DFFMPEG_ROOT="${env:FFMPEG_ROOT}" `
            -DPROTOC="${env:PROTOC_EXE}" `
            -DPKG_CONFIG_EXECUTABLE="${env:PKG_CONFIG_EXE}" `
            -DORBISLINK_BUILD_TESTS=OFF `
            -DORBISLINK_VERSION_NAME="${env:ORBISLINK_RELEASE_VERSION}" `
            -DORBISLINK_REPOSITORY="${env:GITHUB_REPOSITORY}" 
      - name: Compilar
        run: cmake --build build
      - name: Juntar executáveis e DLLs
        run: |
          New-Item -ItemType Directory -Force -Path dist/gui | Out-Null
          # Everything left next to the .exe: vcpkg's DLLs (libcurl and
          # co.) are copied there by the build itself.
          Copy-Item build/*.exe dist/gui/
          Copy-Item build/*.dll dist/gui/ -ErrorAction SilentlyContinue
          # FFmpeg's DLLs do not go through CMake's TARGET_RUNTIME_DLLS
          # (chiaki's FindFFMPEG creates imported targets without the DLL
          # location), so they are copied from here by hand.
          if ($env:FFMPEG_ROOT) {
            Copy-Item "$env:FFMPEG_ROOT/bin/*.dll" dist/gui/ -Force
          }
          # Qt (plugins, QML) e o runtime do MSVC (MSVCP140, VCRUNTIME140...).
          & "${env:QT_ROOT_DIR}\bin\windeployqt.exe" --qmldir qml/orbislink `
            --release --no-translations --compiler-runtime dist/gui/orbislink-gui.exe

          # What windeployqt actually left behind, so nobody has to
          # guess when something is missing.
          Write-Host "--- pastas em dist/gui ---"
          Get-ChildItem dist/gui -Directory | Select-Object -ExpandProperty Name
          if (Test-Path dist/gui/plugins) {
            Write-Host "--- plugins ---"
            Get-ChildItem dist/gui/plugins -Directory | Select-Object -ExpandProperty Name
          }

          # windeployqt scans the .qml files for imports, but the result
          # is not guaranteed: QtMultimedia is in a file that is only
          # loaded by a Loader, and may not come along. Without the QML
          # module VideoOutput does not exist and Remote Play has no picture.
          #
          # Instead of relying on qmlimportscanner, what is missing is copied
          # from the Qt installation itself. The path where windeployqt puts
          # them changes between versions, so both are accepted.
          foreach ($modulo in @('QtMultimedia')) {
            $jaLa = (Test-Path "dist/gui/$modulo") -or (Test-Path "dist/gui/qml/$modulo")
            if ($jaLa) {
              Write-Host "Modulo QML ${modulo}: ja estava."
              continue
            }
            $origem = "${env:QT_ROOT_DIR}/qml/$modulo"
            if (-not (Test-Path $origem)) {
              throw "Nao encontrei o modulo QML ${modulo} em ${origem}. O Qt foi instalado sem o qtmultimedia?"
            }
            Copy-Item $origem dist/gui/ -Recurse -Force
            Write-Host "Modulo QML ${modulo}: copiado a mao de $origem"
          }

          # The multimedia backend plugins come the same way. Without them
          # there is no QAudioSink at all: the picture still appears (it is
          # pushed by hand into a QVideoSink) and the game is silent, with
          # no error at all. So the folder is checked to contain DLLs, not
          # just to exist: an empty folder would give an installer with no sound.
          $destinoMultimedia = "dist/gui/multimedia"
          $jaTem = (Get-ChildItem $destinoMultimedia -Filter *.dll -Recurse -ErrorAction SilentlyContinue | Measure-Object).Count
          if ($jaTem -eq 0) {
            $pluginsMultimedia = "${env:QT_ROOT_DIR}/plugins/multimedia"
            if (-not (Test-Path $pluginsMultimedia)) {
              throw "Nao encontrei os plugins de multimedia em ${pluginsMultimedia}. O Qt foi instalado sem o qtmultimedia?"
            }
            if (Test-Path $destinoMultimedia) { Remove-Item $destinoMultimedia -Recurse -Force }
            Copy-Item $pluginsMultimedia dist/gui/ -Recurse -Force
            Write-Host "Plugins de multimedia: copiados a mao."
          }
          $dllsMultimedia = Get-ChildItem $destinoMultimedia -Filter *.dll -Recurse -ErrorAction SilentlyContinue
          if (-not $dllsMultimedia) {
            throw "A pasta ${destinoMultimedia} ficou sem plugins nenhuns. O Remote Play sairia sem som."
          }
          Write-Host "Plugins de multimedia:"
          $dllsMultimedia | Select-Object -ExpandProperty Name
      - name: Garantir o runtime do MSVC
        run: |
          # NOTE: the runners have more than one version of the redistributable
          # installed. Picking any one (Select-Object -First 1) may bring the
          # Visual Studio 2019 one (14.29) over the 2022 one the application
          # needs, and that gives an access violation inside MSVCP140.dll even
          # before the window appears. So the newest is always chosen,
          # and the whole set comes from the same folder, so the three DLLs are
          # never from different versions.
          $candidatos = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio" `
            -Recurse -Filter "VCRUNTIME140.dll" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'x64\\Microsoft\.VC\d+\.CRT' }
          if (-not $candidatos) { throw "Não encontrei o redistribuível do MSVC no runner." }
          # The FileVersion of some of these DLLs carries text after the
          # numbers ("14.29.30157.0 built by: cloudtest"), and that breaks
          # the [version] conversion. Only the numbers are kept.
          function VersaoDoTexto([string]$bruto) {
            if ($bruto -match '^\s*(\d+(\.\d+){1,3})') { return [version]$Matches[1] }
            return [version]"0.0"
          }
          $maisRecente = $candidatos |
            Sort-Object { VersaoDoTexto $_.VersionInfo.FileVersion } -Descending |
            Select-Object -First 1
          Write-Host "Runtime escolhido: $($maisRecente.DirectoryName) ($($maisRecente.VersionInfo.FileVersion))"
          foreach ($dll in @('MSVCP140.dll','VCRUNTIME140.dll','VCRUNTIME140_1.dll')) {
            $origem = Join-Path $maisRecente.DirectoryName $dll
            if (Test-Path $origem) { Copy-Item $origem dist/gui/ -Force }
          }
      - name: Verificar que não falta nenhuma DLL
        run: |
          # A package without the MSVC runtime or libcurl builds and packages
          # without error, and only blows up on the machine of whoever installs it.
          $required = @('orbislink-gui.exe','Qt6Core.dll','Qt6Quick.dll','Qt6Qml.dll',
                        'libcurl.dll','MSVCP140.dll','VCRUNTIME140.dll','VCRUNTIME140_1.dll',
                        'Qt6Multimedia.dll')
          $missing = $required | Where-Object { -not (Test-Path "dist/gui/$_") }
          Get-ChildItem dist/gui | Select-Object Name, Length | Format-Table -AutoSize
          if ($missing) { throw "Faltam ficheiros no pacote: $($missing -join ', ')" }
          if (-not (Test-Path "dist/gui/platforms/qwindows.dll")) {
            throw "Falta o plugin de plataforma platforms/qwindows.dll"
          }
          # Without QtMultimedia's QML module VideoOutput does not exist and the
          # Remote Play window stays black without saying why. Where it
          # lands changes between windeployqt versions, so both
          # count — what does not count is being in neither.
          if (-not ((Test-Path "dist/gui/QtMultimedia") -or (Test-Path "dist/gui/qml/QtMultimedia"))) {
            throw "Falta a pasta QML QtMultimedia (nem o windeployqt nem a cópia à mão a trouxeram)"
          }
          # FFmpeg's version number changes with every build, so it is
          # searched by pattern instead of a fixed name.
          if (-not (Test-Path "dist/gui/SDL2.dll")) {
            throw "Falta o SDL2.dll: o comando físico não funcionaria."
          }
          foreach ($lib in @('avcodec','avutil','avformat')) {
            if (-not (Get-ChildItem dist/gui -Filter "$lib-*.dll")) {
              # The braces are not decoration: a variable name followed by
              # a colon is read by PowerShell as a scope qualifier, and
              # the script does not even run.
              throw "Falta a DLL do ${lib}: o Remote Play não arrancaria."
            }
          }
          # The three runtime DLLs must be the same version and must not be
          # older than the compiler that produced the executable.
          function VersaoDoTexto([string]$bruto) {
            if ($bruto -match '^\s*(\d+(\.\d+){1,3})') { return [version]$Matches[1] }
            return [version]"0.0"
          }
          $versoes = @{}
          foreach ($dll in @('MSVCP140.dll','VCRUNTIME140.dll','VCRUNTIME140_1.dll')) {
            $versao = VersaoDoTexto (Get-Item "dist/gui/$dll").VersionInfo.FileVersion
            $versoes[$dll] = $versao.ToString()
            Write-Host "$dll -> $versao"
          }
          $distintas = @($versoes.Values | Select-Object -Unique)
          if ($distintas.Count -ne 1) {
            throw "Runtime do MSVC misturado: $($versoes | Out-String)"
          }
          $minima = [version]"14.30"
          $atual = [version]$distintas[0]
          if ($atual -lt $minima) {
            throw "Runtime do MSVC demasiado antigo ($atual). A aplicação é compilada com o Visual Studio 2022 e precisa de 14.30 ou superior."
          }
          Write-Host "Pacote completo (runtime $atual)."
      - uses: actions/upload-artifact@v4
        with:
          name: orbislink-gui-windows-x64
          path: dist/gui

  windows:
    name: Windows x64 (mingw-w64 + NSIS)
    runs-on: ubuntu-latest
    needs: [versao, windows-gui]
    env:
      ORBISLINK_RELEASE_VERSION: ${{ needs.versao.outputs.versao }}
    steps:
      - uses: actions/checkout@v4
      - name: Trazer a interface gráfica compilada no job anterior
        uses: actions/download-artifact@v4
        with:
          name: orbislink-gui-windows-x64
          path: gui-payload
      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 nsis cmake ninja-build zip
      - name: Cache do libcurl para mingw
        uses: actions/cache@v4
        with:
          path: build-windows/curl-install
          key: curl-mingw-8_11_1-${{ runner.os }}
      - name: Compilar e empacotar (CLI + interface + instalador)
        run: ORBISLINK_GUI_DIR="$PWD/gui-payload" ./scripts/build-windows.sh
        env:
          ORBISLINK_VERSION: ${{ env.ORBISLINK_RELEASE_VERSION }}
          # The repository this is running in, not a name written in the
          # code: a fork points at itself without editing anything.
          ORBISLINK_REPOSITORY: ${{ github.repository }}
          ORBISLINK_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - name: Verificar que o executável não depende de DLLs extra
        run: |
          deps=$(x86_64-w64-mingw32-objdump -p dist/windows/orbislink-cli.exe \
            | grep "DLL Name" | awk '{print tolower($3)}' | sort -u)
          echo "$deps"
          for dll in $deps; do
            case "$dll" in
              kernel32.dll|msvcrt.dll|ws2_32.dll|advapi32.dll|crypt32.dll|bcrypt.dll|iphlpapi.dll|user32.dll|shell32.dll|ole32.dll|shlwapi.dll) ;;
              *) echo "DLL inesperada: $dll" >&2; exit 1 ;;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: orbislink-windows-x64
          path: |
            dist/*.exe
            dist/*.zip

  linux:
    name: Linux x86-64
    needs: versao
    runs-on: ubuntu-latest
    env:
      ORBISLINK_RELEASE_VERSION: ${{ needs.versao.outputs.versao }}
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev
      - name: Compilar, testar e empacotar
        run: ./scripts/build-linux.sh
        env:
          ORBISLINK_VERSION: ${{ env.ORBISLINK_RELEASE_VERSION }}
          ORBISLINK_REPOSITORY: ${{ github.repository }}
      - uses: actions/upload-artifact@v4
        with:
          name: orbislink-linux-x86_64
          path: dist/*.tar.gz

  release:
    name: Publicar Release
    needs: [versao, windows, linux]
    runs-on: ubuntu-latest
    env:
      ORBISLINK_RELEASE_VERSION: ${{ needs.versao.outputs.versao }}
    permissions:
      contents: write
    steps:
      # Only the finished packages. The interface artifact is a folder with
      # hundreds of Qt DLLs — it already goes inside the installer and the zip.
      - uses: actions/download-artifact@v4
        with:
          name: orbislink-windows-x64
          path: artefactos
      - uses: actions/download-artifact@v4
        with:
          name: orbislink-linux-x86_64
          path: artefactos
      - run: ls -lh artefactos
      # One .sha256 per file. This is what the app uses to confirm what it
      # downloaded before running the installer: without it, the only guarantee
      # is HTTPS, and the app says in the log that it could not verify.
      - name: Publicar os SHA-256 ao lado dos ficheiros
        run: |
          cd artefactos
          for ficheiro in *.exe *.zip *.tar.gz; do
            [ -e "$ficheiro" ] || continue
            sha256sum "$ficheiro" > "$ficheiro.sha256"
          done
          ls -lh
          cat *.sha256
      - name: Publicar a compilação de testes
        if: needs.versao.outputs.testes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.ORBISLINK_RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          name: OrbisLink ${{ env.ORBISLINK_RELEASE_VERSION }} (testes)
          prerelease: true
          # A dev never becomes "the latest" on the repository page:
          # whoever comes from outside has to see the stable.
          make_latest: false
          files: |
            artefactos/*.exe
            artefactos/*.zip
            artefactos/*.tar.gz
            artefactos/*.sha256
          body: |
            ## Compilação de testes ${{ env.ORBISLINK_RELEASE_VERSION }}

            Feita automaticamente a partir do commit `${{ github.sha }}`.

            Chega à aplicação no canal **Testes (builds da branch)**
            (Definições → Actualizações). Não passou por mais ninguém —
            se algo correr mal, o canal **Estável** volta à última versão
            final quando ela for mais recente do que esta.
      # Only the latest testing builds matter; without this the releases
      # page would fill up with one per push. Any whose commit is no longer
      # in this branch's history is deleted too (after the history is
      # rewritten, for example). Stables are never deleted.
      - name: Histórico, para saber que compilações ainda lhe pertencem
        if: needs.versao.outputs.testes == 'true'
        uses: actions/checkout@v4
        with:
          path: historico
          fetch-depth: 0
      - name: Apagar compilações de testes antigas
        if: needs.versao.outputs.testes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mantidas=0
          gh release list -R "$GITHUB_REPOSITORY" --limit 200 \
              --json tagName,isPrerelease \
              --jq '.[] | select(.isPrerelease) | .tagName' \
            | grep -E -- '-dev\.[0-9]+$' \
            | sort -t. -k4,4nr \
            | while read -r tag; do
                commit=$(git -C historico rev-list -n1 "refs/tags/$tag" 2>/dev/null || true)
                if [ -n "$commit" ] \
                  && git -C historico merge-base --is-ancestor "$commit" "$GITHUB_SHA" \
                  && [ "$mantidas" -lt 5 ]; then
                  mantidas=$((mantidas + 1))
                  echo "Fica $tag"
                  continue
                fi
                echo "A apagar $tag"
                gh release delete "$tag" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes
              done
      # A stable replaces the testing builds of the same version or
      # older (the beta branch ones already ahead stay). If the version
      # itself is already published, it is replaced: the tag now points
      # at the commit just built.
      - name: Arrumar antes de publicar a versão estável
        if: needs.versao.outputs.testes != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          estavel="${ORBISLINK_RELEASE_VERSION#v}"
          gh release list -R "$GITHUB_REPOSITORY" --limit 200 \
              --json tagName,isPrerelease \
              --jq '.[] | select(.isPrerelease) | .tagName' \
            | grep -E -- '-dev\.[0-9]+$' \
            | while read -r tag; do
                base="${tag#v}"
                base="${base%%-*}"
                maior=$(printf '%s\n%s\n' "$base" "$estavel" | sort -V | tail -n1)
                if [ "$maior" = "$estavel" ]; then
                  echo "A apagar $tag"
                  gh release delete "$tag" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes
                else
                  echo "Fica $tag"
                fi
              done
          if gh release view "$ORBISLINK_RELEASE_VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A substituir $ORBISLINK_RELEASE_VERSION"
            gh release delete "$ORBISLINK_RELEASE_VERSION" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
      - name: Publicar a versão estável
        if: needs.versao.outputs.testes != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.ORBISLINK_RELEASE_VERSION }}
          # Without this the action creates the tag on the repository's default
          # branch, and not on the commit actually built: the binaries are
          # right but the Release's source code points elsewhere.
          target_commitish: ${{ github.sha }}
          name: OrbisLink ${{ env.ORBISLINK_RELEASE_VERSION }}
          files: |
            artefactos/*.exe
            artefactos/*.zip
            artefactos/*.tar.gz
            artefactos/*.sha256
          generate_release_notes: true
          body: |
            ## OrbisLink ${{ env.ORBISLINK_RELEASE_VERSION }}

            **Windows:** `OrbisLink-*-setup.exe` (instalador, com a interface
            gráfica e a linha de comandos) ou `OrbisLink-*-windows-x64.zip`
            (portátil, sem instalar).

            **Linux:** `orbislink-*-linux-x86_64.tar.gz`.

            O instalador cria a regra de firewall que permite à consola
            descarregar os pkg do PC — sem ela a instalação fica em 0 bytes.

            **Remote Play:** descobre a consola, regista este PC (PIN de 8
            dígitos + Account ID da PSN), acorda-a se estiver em repouso, e
            liga com vídeo e som. Vídeo descodificado na placa gráfica, com
            recuo automático para o processador. Comando por SDL com
            vibração, teclado (o botão "Teclas" mostra o mapa), rato a fazer
            de touchpad, e ecrã inteiro com F11. A resolução, os fps e o
            bitrate escolhem-se nas definições.

            **Microfone:** desligado por omissão. O botão fica vermelho
            enquanto está a captar e diz de que dispositivo vem, e fecha
            com a sessão — ninguém pode estar a ser ouvido sem dar por
            isso. Clique esquerdo cala, clique direito desliga.

            Falta o Remote Play pela PSN: por enquanto só rede local.

            **Se o som não sair:** exporta o diagnóstico (Ctrl+L, depois
            "Guardar relatório"). Ele diz, troço a troço, em que ponto do
            caminho é que o som se perde.

            **Verificação de actualizações:** nas definições. Lê os
            lançamentos deste repositório, confirma o SHA-256 e instala num
            clique. No canal "Testes" recebe também a compilação de cada
            push, antes de haver versão final.

            **Diagnóstico:** Ctrl+L abre o registo ao vivo, com um botão
            para guardar o relatório no ambiente de trabalho. É o que se
            anexa a um pedido de ajuda para se perceber o que falhou.
      # The hashes also go in the notes, one line per file. The app first
      # looks there for the line with the name of the file it downloads; the
      # .sha256 asset remains as an alternative.
      - name: Juntar os SHA-256 às notas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$ORBISLINK_RELEASE_VERSION" -R "$GITHUB_REPOSITORY" \
            --json body --jq .body > notas.md
          {
            printf '\n\n### SHA-256\n\n'
            for ficheiro in artefactos/*.exe artefactos/*.zip artefactos/*.tar.gz; do
              [ -e "$ficheiro" ] || continue
              printf '`%s`  %s\n\n' "$(cut -d' ' -f1 "$ficheiro.sha256")" "$(basename "$ficheiro")"
            done
          } >> notas.md
          cat notas.md
          gh release edit "$ORBISLINK_RELEASE_VERSION" -R "$GITHUB_REPOSITORY" --notes-file notas.md
